services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: run-agent-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
